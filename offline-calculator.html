<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090b0c">
  <meta name="color-scheme" content="dark">
  <title>Tiền của Điền</title>
  <style>
:root{--bg:#090b0c;--panel:#121517;--field:#0c0f11;--line:#252b2f;--text:#f4f7f8;--muted:#899197;--accent:#00e68a;--bad:#ff6670;--warn:#f2c14e}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);overflow:hidden}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}button,input{font:inherit}.app{height:100dvh;max-width:620px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom));display:grid;grid-template-rows:auto auto auto 1fr;gap:10px;background:radial-gradient(circle at 90% -10%,rgba(0,230,138,.12),transparent 36%)}header{display:flex;justify-content:space-between;align-items:center;gap:12px}.route{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--accent)}h1{margin:2px 0 0;font-size:27px;line-height:1;letter-spacing:-.045em}.install{border:1px solid var(--line);background:var(--panel);color:var(--accent);font-size:11px;font-weight:850;padding:8px 11px;border-radius:10px;cursor:pointer}.hidden{display:none!important}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.tab{height:34px;border:1px solid var(--line);border-radius:10px;background:#101315;color:var(--muted);font-size:12px;font-weight:900;letter-spacing:.04em;cursor:pointer}.tab.active{color:#07110d;background:var(--accent);border-color:var(--accent)}.panel{border:1px solid var(--line);background:linear-gradient(180deg,#15191b,var(--panel));border-radius:17px;padding:12px}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:10px}.inputs label.wide{grid-column:1/-1}.inputs label>span{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:11px;font-weight:780;color:#c7cdd0;margin:0 2px 5px}.inputs small{font-size:8px;color:var(--muted);font-weight:900;letter-spacing:.07em}.field{height:45px;display:flex;align-items:center;border:1px solid var(--line);background:var(--field);border-radius:12px;overflow:hidden}.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,230,138,.08)}.field.rate-highlight{background:linear-gradient(180deg,rgba(0,230,138,.18),rgba(0,230,138,.08));border-color:rgba(0,230,138,.62);box-shadow:inset 0 0 0 1px rgba(0,230,138,.06)}.field.rate-highlight input{color:#f7fffb}.field.rate-highlight b{color:var(--accent)}.field input{width:100%;min-width:0;height:100%;border:0;outline:0;background:transparent;color:var(--text);padding:0 11px;font-size:16px;font-weight:800}.field input::placeholder{color:#535b60;font-size:12px;font-weight:650}.field b{font-size:9px;color:var(--muted);padding:0 10px}.received{display:block;margin:5px 3px 0;color:var(--muted);font-size:10px;line-height:1.15;font-style:normal;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-card{min-height:0;border:1px solid #284439;background:linear-gradient(180deg,#142119,#101613);border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}.result-card span{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.12em}.result-card strong{font-size:clamp(30px,8vw,46px);line-height:1.03;margin:8px 0 4px;letter-spacing:-.055em}.result-card b{font-size:16px}.good{color:var(--accent)!important}.bad{color:var(--bad)!important}.neutral{color:var(--warn)!important}
@media(max-width:390px){.app{padding-left:10px;padding-right:10px;gap:8px}.panel{padding:10px}.inputs{gap:8px}.field{height:41px}.field input{font-size:14px}h1{font-size:23px}.received{font-size:9px;margin-top:4px}.result-card{padding:11px}.result-card strong{font-size:29px}.tab{height:31px;font-size:11px}}
@media(max-height:690px){.app{gap:7px;padding-top:7px;padding-bottom:7px}.route{font-size:9px}h1{font-size:20px}.tabs{gap:5px}.tab{height:28px;font-size:10px}.panel{padding:8px}.inputs{gap:6px}.inputs label>span{font-size:9px;margin-bottom:3px}.field{height:33px}.field input{font-size:13px}.received{font-size:8px;margin-top:3px}.result-card{padding:8px}.result-card strong{font-size:26px;margin:4px 0 2px}}

  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="route" id="routeText">VND → USDT → EUR → VND</div>
        <h1>Tiền của Điền</h1>
      </div>
      <button id="installBtn" class="install hidden">Cài app</button>
    </header>

    <nav class="tabs" aria-label="Loại vòng tiền">
      <button class="tab active" data-page="eur">EUR</button>
      <button class="tab" data-page="cad">CAD</button>
      <button class="tab" data-page="try">TRY</button>
      <button class="tab" data-page="jpy">JPY</button>
    </nav>

    <section class="panel inputs">
      <label class="wide">
        <span>Vốn ban đầu</span>
        <div class="field"><input id="capital" inputmode="numeric" value="100.000.000"><b id="capitalUnit">VND</b></div>
      </label>

      <label>
        <span id="rate1Label">USDT / VND <small>P2P</small></span>
        <div class="field"><input id="rate1" inputmode="decimal" placeholder="Ví dụ 26.300"><b id="rate1Unit">VND</b></div>
        <em class="received" id="received1">Nhận: — USDT</em>
      </label>

      <label>
        <span id="rate2Label">USDT / EUR <small>P2P</small></span>
        <div class="field"><input id="rate2" inputmode="decimal" placeholder="Ví dụ 0,8600"><b id="rate2Unit">EUR</b></div>
        <em class="received" id="received2">Nhận: — EUR</em>
      </label>

      <label class="wide">
        <span id="rate3Label">EUR / VND</span>
        <div class="field"><input id="rate3" inputmode="decimal" placeholder="Ví dụ 30.700"><b id="rate3Unit">VND</b></div>
        <em class="received" id="received3">Nhận: — VND</em>
      </label>
    </section>

    <section class="result-card">
      <span>LÃI / LỖ</span>
      <strong id="profit">—</strong>
      <b id="roi">—</b>
    </section>
  </main>
  <script>
const $=id=>document.getElementById(id);
const fmt0=new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0});
const fmt2=new Intl.NumberFormat('vi-VN',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmt4=new Intl.NumberFormat('vi-VN',{minimumFractionDigits:0,maximumFractionDigits:4});

const PAGES={
  eur:{
    route:'VND → USDT → EUR → VND',capital:'VND',highlight:1,
    rates:[
      {label:'USDT / VND',tag:'P2P',unit:'VND',placeholder:'Ví dụ 26.300',receive:'USDT',op:'divide',vndThousands:true},
      {label:'USDT / EUR',tag:'P2P',unit:'EUR',placeholder:'Ví dụ 0,8600',receive:'EUR',op:'multiply'},
      {label:'EUR / VND',tag:'',unit:'VND',placeholder:'Ví dụ 30.700',receive:'VND',op:'multiply',vndThousands:true}
    ]
  },
  cad:{
    route:'VND → USDT → CAD → VND',capital:'VND',highlight:0,
    rates:[
      {label:'USDT / VND',tag:'P2P',unit:'VND',placeholder:'Ví dụ 26.300',receive:'USDT',op:'divide',vndThousands:true},
      {label:'USDT / CAD',tag:'P2P',unit:'CAD',placeholder:'Ví dụ 1,3900',receive:'CAD',op:'multiply'},
      {label:'CAD / VND',tag:'',unit:'VND',placeholder:'Ví dụ 19.000',receive:'VND',op:'multiply',vndThousands:true}
    ]
  },
  try:{
    route:'TRY → EUR → USDT → TRY',capital:'TRY',highlight:3,
    rates:[
      {label:'EUR / TRY',tag:'',unit:'TRY',placeholder:'Ví dụ 48,50',receive:'EUR',op:'divide'},
      {label:'USDT / EUR',tag:'',unit:'EUR',placeholder:'Ví dụ 0,8550',receive:'USDT',op:'divide'},
      {label:'USDT / TRY',tag:'',unit:'TRY',placeholder:'Ví dụ 41,50',receive:'TRY',op:'multiply'}
    ]
  },
  jpy:{
    route:'VND → JPY → USDT → VND',capital:'VND',highlight:2,
    rates:[
      {label:'JPY / VND',tag:'',unit:'VND',placeholder:'Ví dụ 165,50',receive:'JPY',op:'divide'},
      {label:'USDT / JPY',tag:'',unit:'JPY',placeholder:'Ví dụ 155,00',receive:'USDT',op:'divide'},
      {label:'USDT / VND',tag:'P2P',unit:'VND',placeholder:'Ví dụ 26.300',receive:'VND',op:'multiply',vndThousands:true}
    ]
  }
};

let page=localStorage.getItem('tiendien_page');
if(!PAGES[page])page='eur';

function capitalNum(v){return Number(String(v??'').replace(/\D/g,''))||0}
function rateNum(v,thousands=false){
  let s=String(v??'').trim().replace(/\s/g,'');
  if(!s)return 0;
  if(s.includes(',')){
    s=s.replace(/\./g,'').replace(',','.');
  }else if(thousands&&/^\d{1,3}(?:\.\d{3})+$/.test(s)){
    s=s.replace(/\./g,'');
  }
  const n=Number(s);
  return Number.isFinite(n)?n:0;
}
function formatCapital(){
  const el=$('capital');
  const digits=el.value.replace(/\D/g,'');
  el.value=digits?fmt0.format(Number(digits)):'';
}
function money(v,unit){return `${v>=0?'+':'−'}${fmt0.format(Math.abs(v))} ${unit}`}
function pct(v){return `${v>=0?'+':''}${fmt2.format(v)}%`}
function tone(el,v){el.classList.remove('good','bad','neutral');el.classList.add(v>0.01?'good':v<-0.01?'bad':'neutral')}
function formatReceived(v,unit){
  if(!(v>0))return `Nhận: — ${unit}`;
  const fmt=(unit==='VND'||unit==='TRY')?fmt2:fmt4;
  return `Nhận: ${fmt.format(v)} ${unit}`;
}
function key(name){return `tiendien_${page}_${name}`}
function save(){['capital','rate1','rate2','rate3'].forEach(id=>localStorage.setItem(key(id),$(id).value))}
function migrateReciprocalRate2(){
  if(page!=='try'&&page!=='jpy')return;
  const flag=`tiendien_${page}_rate2_quote_v2`;
  if(localStorage.getItem(flag)==='1')return;
  const oldKey=`tiendien_${page}_rate2`;
  const old=localStorage.getItem(oldKey);
  if(old){
    const n=rateNum(old,false);
    if(n>0)localStorage.setItem(oldKey,String(1/n).replace('.',','));
  }
  localStorage.setItem(flag,'1');
}
function restorePage(){
  migrateReciprocalRate2();
  const defaultCapital=page==='try'?'100.000':'100.000.000';
  if(page==='eur'&&localStorage.getItem(key('capital'))===null){
    const legacy={capital:'tiendien_capitalVnd',rate1:'tiendien_usdtVnd',rate2:'tiendien_usdtEur',rate3:'tiendien_eurVnd'};
    Object.entries(legacy).forEach(([id,k])=>{const v=localStorage.getItem(k);if(v!==null)localStorage.setItem(key(id),v)});
  }
  $('capital').value=localStorage.getItem(key('capital'))??defaultCapital;
  ['rate1','rate2','rate3'].forEach(id=>$(id).value=localStorage.getItem(key(id))??'');
  formatCapital();
}
function renderPage(){
  const cfg=PAGES[page];
  $('routeText').textContent=cfg.route;
  $('capitalUnit').textContent=cfg.capital;
  cfg.rates.forEach((r,i)=>{
    const n=i+1;
    $( `rate${n}Label` ).innerHTML=`${r.label}${r.tag?` <small>${r.tag}</small>`:''}`;
    $( `rate${n}Unit` ).textContent=r.unit;
    $( `rate${n}` ).placeholder=r.placeholder;
    $( `received${n}` ).textContent=`Nhận: — ${r.receive}`;
    $( `rate${n}` ).closest('.field').classList.toggle('rate-highlight',n===cfg.highlight);
  });
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  localStorage.setItem('tiendien_page',page);
  restorePage();
  calculate();
}
function calculate(){
  const cfg=PAGES[page];
  const capital=capitalNum($('capital').value);
  const rates=cfg.rates.map((r,i)=>rateNum($(`rate${i+1}`).value,!!r.vndThousands));
  let amount=capital;
  const received=[];
  for(let i=0;i<3;i++){
    const r=rates[i],op=cfg.rates[i].op;
    if(!(amount>0&&r>0)){amount=0;received.push(0);continue}
    amount=op==='divide'?amount/r:amount*r;
    received.push(amount);
  }
  cfg.rates.forEach((r,i)=>$(`received${i+1}`).textContent=formatReceived(received[i],r.receive));
  if(!(capital>0&&amount>0)){
    $('profit').textContent='—';$('roi').textContent='—';
    $('profit').className='';$('roi').className='';save();return;
  }
  const profit=amount-capital;
  const roi=profit/capital*100;
  $('profit').textContent=money(profit,cfg.capital);
  $('roi').textContent=pct(roi);
  tone($('profit'),profit);tone($('roi'),profit);
  save();
}

$('capital').addEventListener('input',()=>{formatCapital();calculate()});
['rate1','rate2','rate3'].forEach(id=>$(id).addEventListener('input',calculate));
document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{save();page=btn.dataset.page;renderPage()}));
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').classList.remove('hidden')});
$('installBtn').addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('installBtn').classList.add('hidden')});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
renderPage();

  </script>
</body>
</html>
